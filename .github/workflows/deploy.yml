name: Publicar no GitHub Pages

# Ambiente de TESTE, para revisao interna e apresentacao ao cliente.
# O site sai com noindex e robots.txt bloqueando tudo, para nao
# concorrer no Google com o site real da Aucom.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          SITE_URL: https://supportsolucoes.github.io
          BASE_PATH: /aucom-site
        run: npm run build

      - name: Bloquear buscadores no ambiente de teste
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
